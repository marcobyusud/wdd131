<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body>

  <main>
    <h1 id="galeria">Página Inicial</h1>
    <div class="temple-grid">
      <figure>
        <img src="imagens/templo-1.jpg" alt="Templo com uma torre central e palmeiras ao redor" width="800" height="500" loading="lazy">
        <figcaption>Templo 1</figcaption>
      </figure>
      <figure>
        <img src="imagens/templo-2.jpg" alt="Templo iluminado à noite sob um céu nublado" width="800" height="500" loading="lazy">

      </figure>
      <figure>

      <figure>

      </figure>
      <figure>

      <figure>
